// --------------------
// plugins
// --------------------

plugins {
    id 'com.palantir.git-version'   version '0.8.0'
    id 'co.riiid.gradle'            version '0.4.2'
    id 'codenarc'
}

apply plugin: 'groovy'
apply plugin: 'application'
apply plugin: 'maven-publish'

// --------------------
// dependencies
// --------------------

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.jenkins-ci.org/public/'
    }
}

dependencies {
    implementation group: 'org.apache.groovy', name: 'groovy-all', version: '4.0.24'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'org.slf4j:slf4j-simple:2.0.16'
    implementation('org.jfrog.artifactory.client:artifactory-java-client-services:2.19.1') {
        exclude group: 'org.codehaus.groovy'
    }
    implementation fileTree('libs') {
        include '*.jar'
    }
    implementation 'net.praqma:praqmajutils:1.0.0'
    testImplementation group: 'org.spockframework', name: 'spock-core', version: '2.3-groovy-4.0'
}

// --------------------
// project configuration
// --------------------

task uberjar(type: Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn('compileGroovy')
    from files(sourceSets.main.output.classesDirs)
    from configurations.runtimeClasspath.asFileTree.files.collect { zipTree(it) }
    manifest {
        attributes 'Main-Class': 'toGit.Run'
    }
}

application {
    mainClass = 'toGit.Run'
}

github {
    owner   = 'Praqma'
    repo    = '2git'
    token   = project.hasProperty("GITHUB_TOKEN") ? "$GITHUB_TOKEN" : "No token provided"
    tagName = gitVersion()
    name    = gitVersion()
    assets  = [
        "build/distributions/2git-${gitVersion()}.zip",
        "build/distributions/2git-${gitVersion()}.tar"
    ]
    targetCommitish = 'master'
}

githubRelease.group = "Publishing"
githubRelease.description = "Creates a release on GitHub"

// --------------------
// codenarc
// --------------------

boolean runCodenarc = project.findProperty('CODENARC') == "true"

codenarcMain.onlyIf { runCodenarc }

codenarcTest.onlyIf { runCodenarc }
